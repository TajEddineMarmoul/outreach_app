<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="768" viewBox="0 0 1366 768">
  <rect width="1366" height="768" fill="#f5f7fb"/>
  <rect x="24" y="24" width="1318" height="720" rx="10" fill="#fff" stroke="#dce2ec"/>
  <path d="M24 82h1318" stroke="#dce2ec"/>
  <text x="52" y="61" fill="#0751f8" font-family="Arial" font-size="21" font-weight="700">OUTREACH</text><text x="192" y="61" fill="#506184" font-family="Arial" font-size="14">← Campaigns</text><text x="300" y="61" fill="#101a34" font-family="Arial" font-size="15" font-weight="700">Fall hiring outreach</text>
  <text x="110" y="142" fill="#101a34" font-family="Arial" font-size="28" font-weight="700">Choose your audience</text><text x="110" y="173" fill="#506184" font-family="Arial" font-size="15">Import the people you want to reach. You can add more later.</text>
  <rect x="110" y="199" width="420" height="42" rx="5" fill="#fff" stroke="#cfd8e6"/><text x="124" y="225" fill="#8a96aa" font-family="Arial" font-size="14">Search contacts</text>
  <rect x="542" y="199" width="160" height="42" rx="5" fill="#fff" stroke="#0751f8"/><text x="560" y="225" fill="#0751f8" font-family="Arial" font-size="14" font-weight="700">＋ Import contacts</text>
  <rect x="110" y="264" width="592" height="84" rx="7" fill="#f4f7ff" stroke="#bfd4ff"/><circle cx="136" cy="291" r="12" fill="#0751f8"/><text x="132" y="296" fill="#fff" font-family="Arial" font-size="12" font-weight="700">1</text><text x="160" y="292" fill="#101a34" font-family="Arial" font-size="14" font-weight="700">Start with an import</text><text x="160" y="317" fill="#506184" font-family="Arial" font-size="12">First row must contain email. Extra columns become custom fields.</text>
  <rect x="110" y="370" width="592" height="140" rx="7" fill="#fff" stroke="#dce2ec"/><text x="126" y="398" fill="#60708e" font-family="Arial" font-size="11" font-weight="700">NAME</text><text x="278" y="398" fill="#60708e" font-family="Arial" font-size="11" font-weight="700">EMAIL</text><text x="440" y="398" fill="#60708e" font-family="Arial" font-size="11" font-weight="700">CUSTOM FIELDS</text><text x="616" y="398" fill="#60708e" font-family="Arial" font-size="11" font-weight="700">STATUS</text><path d="M110 414h592" stroke="#e8ecf3"/><text x="126" y="449" fill="#60708e" font-family="Arial" font-size="13">No contacts yet</text>
  <rect x="770" y="128" width="480" height="460" rx="9" fill="#fff" stroke="#cfd8e6" filter="url(#shadow)"/><text x="800" y="170" fill="#101a34" font-family="Arial" font-size="21" font-weight="700">Import contacts</text><text x="800" y="197" fill="#506184" font-family="Arial" font-size="14">Use any columns you have. Extra columns stay available</text><text x="800" y="219" fill="#506184" font-family="Arial" font-size="14">for personalization.</text>
  <rect x="800" y="245" width="420" height="104" rx="7" fill="#fbfcff" stroke="#9fb5d9" stroke-dasharray="6 4"/><text x="885" y="286" fill="#101a34" font-family="Arial" font-size="14" font-weight="700">Drop a CSV here or choose a file</text><text x="900" y="312" fill="#506184" font-family="Arial" font-size="12">First row must include an email column</text>
  <text x="1000" y="378" fill="#60708e" font-family="Arial" font-size="12">or paste rows</text><path d="M800 378h180M1020 378h200" stroke="#dce2ec"/>
  <rect x="800" y="400" width="420" height="70" rx="5" fill="#fff" stroke="#cfd8e6"/><text x="813" y="425" fill="#506184" font-family="Arial" font-size="13">email, first_name, role</text><text x="813" y="450" fill="#a0aabd" font-family="Arial" font-size="13">maya@example.com, Maya, Recruiter</text>
  <rect x="800" y="488" width="125" height="28" rx="4" fill="#effaf5" stroke="#b5e5d2"/><text x="813" y="507" fill="#00724f" font-family="Arial" font-size="12">✓ email detected</text><rect x="935" y="488" width="82" height="28" rx="4" fill="#fff" stroke="#dce2ec"/><text x="947" y="507" fill="#506184" font-family="Arial" font-size="12">first_name</text><rect x="1027" y="488" width="48" height="28" rx="4" fill="#fff" stroke="#dce2ec"/><text x="1040" y="507" fill="#506184" font-family="Arial" font-size="12">role</text>
  <path d="M800 535h420" stroke="#e8ecf3"/><text x="1060" y="566" fill="#0751f8" font-family="Arial" font-size="14" font-weight="700">Preview import →</text><text x="800" y="566" fill="#506184" font-family="Arial" font-size="14">Cancel</text><text x="800" y="612" fill="#60708e" font-family="Arial" font-size="12">Duplicates and skipped rows are shown before anything is saved.</text>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#101a34" flood-opacity=".16"/></filter></defs>
</svg>
